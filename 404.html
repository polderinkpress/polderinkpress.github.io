<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found – Polder Ink Press</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..700,100&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1E2A44;--field:#4E7A45;--field-light:#6E9A5C;--ditch:#9CC3DA;--sky:#E8F0F2;--lamp:#E9B44C;--muted:#566074}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--sky);color:var(--ink);font:400 17px/1.65 Poppins,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
  .box{max-width:30em}
  img{width:64px;height:64px;display:block;margin-bottom:20px}
  h1{font:650 clamp(32px,5vw,46px)/1.1 Fraunces,Georgia,serif;font-variation-settings:"SOFT" 100;margin:0 0 14px;letter-spacing:-.015em}
  p{color:var(--muted);margin:0 0 26px}
  .btns{display:flex;gap:12px;flex-wrap:wrap}
  a.btn{display:inline-block;padding:13px 22px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;border:1.5px solid var(--ink);color:var(--ink)}
  a.dark{background:var(--ink);color:#FFFDF9}
  a:focus-visible{outline:3px solid var(--lamp);outline-offset:3px}
  .polder{height:64px;background:linear-gradient(to bottom,var(--field-light) 0 22%,var(--ditch) 22% 29%,var(--field) 29% 56%,var(--ditch) 56% 63%,#3F6638 63% 100%)}
</style>
</head>
<body>
<main>
  <div class="box">
    <img src="/assets/logo-mark.svg" alt="Polder Ink Press">
    <h1>This page isn't here</h1>
    <p>The link may be old or mistyped. All books and free coloring pages are on the home page.</p>
    <div class="btns"><a class="btn dark" href="/#books">See the books</a><a class="btn" href="/#free">Get free pages</a></div>
  </div>
</main>
<div class="polder" aria-hidden="true"></div>
</body>
</html>
